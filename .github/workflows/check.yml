name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: python3 -m py_compile generate.py
      - name: Help text renders
        run: python3 generate.py --help
      - name: Smoke generation
        run: python3 generate.py RogueAlg0/the-daily-commit --date 01-01 --out /tmp/smoke.html
      - name: Smoke output is a complete page
        run: grep -q "{{TITLE}}" /tmp/smoke.html && exit 1 || exit 0
