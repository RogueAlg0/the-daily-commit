name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: python3 -m py_compile generate.py
      - name: Help text renders
        run: python3 generate.py --help
      - name: Smoke generation
        run: python3 generate.py RogueAlg0/the-daily-commit --date 01-01 --out /tmp/smoke.html
      - name: Smoke output has no unreplaced placeholders
        run: grep -Eq "{{[A-Z]+}}" /tmp/smoke.html && exit 1 || exit 0
      - name: No em dashes or en dashes in source files
        run: >
          grep -rEn "—|–" --include="*.py" --include="*.html"
          --include="*.md" --include="*.sh" --exclude-dir=site
          --exclude-dir=.git . && exit 1 || exit 0
