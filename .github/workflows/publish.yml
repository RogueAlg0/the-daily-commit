name: publish

on:
  push:
    tags:
      - "tdc*"

jobs:
  build-deb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check version matches tag
        run: |
          VER="${GITHUB_REF_NAME#tdc}"
          grep -q "__version__ = \"$VER\"" generate.py
      - name: Build .deb
        run: |
          VER="${GITHUB_REF_NAME#tdc}"
          bash packaging/build-deb.sh "$VER"
      - name: Attach .deb to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#tdc}"
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --generate-notes
          gh release upload "$TAG" "the-daily-commit_${VER}_all.deb" --clobber

  apt-repo:
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev
          bash packaging/build-site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
