<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Daily Commit - daily editions</title>
<script>
  function localMd() {
    var d = new Date();
    return String(d.getMonth() + 1).padStart(2, "0") + "-" +
           String(d.getDate()).padStart(2, "0");
  }
  fetch("latest.json").then(function (r) { return r.json(); }).then(
    function (m) {
      var dates = m.dates || [];
      var md = localMd();
      var target = dates.indexOf(md) >= 0 ? md : dates[dates.length - 1];
      if (target) location.replace(target + ".html");
    }).catch(function () {
      location.replace(localMd() + ".html");
    });
</script>
</head>
<body>
<p>Loading today's paper…</p>
</body>
</html>
