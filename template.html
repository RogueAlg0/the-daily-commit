<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta property="og:title" content="{{TITLE}} - {{DATELINE}} · The Daily Commit">
<meta property="og:description" content="{{LEDE}}">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<style>
  :root {
    --paper: #f5f1e6;
    --ink: #1c1a16;
    --faint: #6b655a;
    --rule: #8a8272;
  }
  * { box-sizing: border-box; }
  body {
    background: #d8d2c2;
    color: var(--ink);
    font-family: Georgia, "Times New Roman", Times, serif;
    margin: 0;
    padding: 1.5rem 1rem;
    line-height: 1.45;
  }
  .page {
    max-width: 960px;
    margin: 0 auto;
    background: var(--paper);
    border: 1px solid var(--rule);
    box-shadow: 0 4px 24px rgba(0,0,0,0.25);
    padding: 2rem 2.5rem 3rem;
  }
  .masthead {
    text-align: center;
    border-top: 4px double var(--ink);
    border-bottom: 4px double var(--ink);
    padding: 0.8rem 0 0.6rem;
    margin-bottom: 0.4rem;
  }
  .masthead .kicker {
    font-variant: small-caps;
    letter-spacing: 0.35em;
    font-size: 0.8rem;
    color: var(--faint);
  }
  .masthead h1 {
    font-size: 3rem;
    margin: 0.2rem 0;
    letter-spacing: 0.02em;
  }
  .masthead .repo {
    font-variant: small-caps;
    letter-spacing: 0.2em;
    font-size: 1rem;
  }
  .dateline {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.2rem 1rem;
    font-variant: small-caps;
    font-size: 0.85rem;
    color: var(--faint);
    border-bottom: 1px solid var(--rule);
    padding-bottom: 0.4rem;
    margin-bottom: 1.2rem;
  }
  .lede {
    font-size: 1.15rem;
    column-span: all;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 1rem;
    margin-bottom: 1.2rem;
    overflow-wrap: break-word;
  }
  .lede::first-letter {
    font-size: 2.6em;
    float: left;
    line-height: 0.85;
    padding-right: 0.12em;
    font-weight: bold;
  }
  .columns {
    column-count: 2;
    column-gap: 2.5rem;
    column-rule: 1px solid var(--rule);
  }
  @media (max-width: 640px) {
    .columns { column-count: 1; }
    .masthead h1 { font-size: 2rem; }
    .page { padding: 1.2rem 1.2rem 2rem; }
  }
  section { margin-bottom: 1.4rem; }
  section h2 {
    font-variant: small-caps;
    letter-spacing: 0.15em;
    font-size: 1.05rem;
    text-align: center;
    border-top: 1px solid var(--ink);
    border-bottom: 1px solid var(--ink);
    padding: 0.25rem 0;
    margin: 0 0 0.8rem;
    break-after: avoid;
    overflow-wrap: break-word;
  }
  details.more { margin-top: 0.5rem; }
  details.more summary {
    cursor: pointer;
    font-variant: small-caps;
    letter-spacing: 0.12em;
    font-size: 0.85rem;
    color: var(--faint);
    text-align: center;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 0.35rem 0;
    list-style: none;
  }
  details.more summary::-webkit-details-marker { display: none; }
  details.more summary::before { content: "\25BC  "; font-size: 0.7em; }
  details.more[open] summary::before { content: "\25B2  "; }
  article { margin-bottom: 0.9rem; overflow-wrap: break-word; }
  article h3 {
    font-size: 1rem;
    margin: 0 0 0.15rem;
    overflow-wrap: break-word;
  }
  article h3 a { color: var(--ink); }
  .byline {
    font-variant: small-caps;
    font-size: 0.78rem;
    color: var(--faint);
    margin-bottom: 0.2rem;
  }
  article p {
    margin: 0;
    font-size: 0.92rem;
    text-align: justify;
  }
  .pullquote {
    column-span: all;
    text-align: center;
    font-style: italic;
    font-size: 1.2rem;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 0.9rem 1.5rem;
    margin: 0 0 1.4rem;
    overflow-wrap: break-word;
  }
  .pullquote p { margin: 0 0 0.35rem; }
  .pullquote p::before { content: "\201C"; }
  .pullquote p::after { content: "\201D"; }
  .weeklink {
    column-span: all;
    text-align: right;
    font-variant: small-caps;
    letter-spacing: 0.06em;
    margin: 0 0 1rem;
  }
  .pullquote .who {
    font-style: normal;
    font-variant: small-caps;
    font-size: 0.82rem;
    letter-spacing: 0.08em;
    color: var(--faint);
  }
  .quiet {
    font-style: italic;
    color: var(--faint);
    text-align: center;
    padding: 2rem 0;
  }
  footer {
    margin-top: 2rem;
    border-top: 4px double var(--ink);
    padding-top: 0.6rem;
    font-size: 0.8rem;
    color: var(--faint);
    text-align: center;
    font-variant: small-caps;
    letter-spacing: 0.1em;
  }
  a { color: #4a3f2a; }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <div class="kicker">{{KICKER}}</div>
    <h1>The Daily Commit</h1>
    <div class="repo">{{TITLE}}</div>
  </header>
  <div class="dateline">
    <span>{{DATELINE}}</span>
    <span>{{RECORD}}</span>
  </div>
  <div class="lede">{{LEDE}}</div>
  <div class="columns">
{{BODY}}
  </div>
  <footer>
    Set in pixels, printed nowhere &middot; generated by <a href="https://github.com/RogueAlg0/the-daily-commit">the-daily-commit</a>{{XKCD}}
  </footer>
</div>
</body>
</html>
