<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta property="og:title" content="{{TITLE}} - {{DATELINE}} · The Daily Commit">
<meta property="og:description" content="{{LEDE}}">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,700;1,8..60,400&display=swap');
  :root {
    --paper: #f8f5ec;
    --ink: #141210;
    --faint: #5c564a;
    --rule: #b8b0a0;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
    margin: 0;
    padding: 0;
    line-height: 1.5;
  }
  .page {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1rem 2rem 3rem;
  }
  .masthead {
    text-align: center;
    border-bottom: 3px double var(--ink);
    padding: 1.2rem 0 0.8rem;
    margin-bottom: 0.3rem;
  }
  .masthead .kicker {
    font-variant: small-caps;
    letter-spacing: 0.4em;
    font-size: 0.75rem;
    color: var(--faint);
    margin-bottom: 0.3rem;
  }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900;
    font-size: 4.2rem;
    margin: 0;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .masthead .repo {
    font-variant: small-caps;
    letter-spacing: 0.25em;
    font-size: 0.95rem;
    margin-top: 0.4rem;
    color: var(--faint);
  }
  .masthead .repo a {
    color: var(--faint);
    text-decoration: none;
    border-bottom: 1px dotted var(--faint);
  }
  .dateline {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.2rem 1rem;
    font-variant: small-caps;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    color: var(--faint);
    border-bottom: 1px solid var(--ink);
    padding: 0.35rem 0;
    margin-bottom: 1rem;
  }
  .lede {
    font-size: 1.1rem;
    line-height: 1.6;
    column-span: all;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 0.9rem;
    margin-bottom: 1rem;
    text-align: justify;
  }
  .lede::first-letter {
    font-family: "Playfair Display", Georgia, serif;
    font-size: 3.2em;
    float: left;
    line-height: 0.8;
    padding-right: 0.1em;
    padding-top: 0.05em;
    font-weight: 900;
  }
  .columns {
    column-count: 3;
    column-gap: 2rem;
    column-rule: 1px solid var(--rule);
  }
  @media (max-width: 900px) {
    .columns { column-count: 2; }
  }
  @media (max-width: 640px) {
    .columns { column-count: 1; }
    .masthead h1 { font-size: 2.6rem; }
    .page { padding: 0.8rem 1rem 2rem; }
  }
  section { margin-bottom: 1.4rem; }
  section h2 {
    font-variant: small-caps;
    letter-spacing: 0.15em;
    font-size: 1.05rem;
    text-align: center;
    border-top: 1px solid var(--ink);
    border-bottom: 1px solid var(--ink);
    padding: 0.25rem 0;
    margin: 0 0 0.8rem;
    break-after: avoid;
    overflow-wrap: break-word;
  }
  details.more { margin-top: 0.5rem; }
  details.more summary {
    cursor: pointer;
    font-variant: small-caps;
    letter-spacing: 0.12em;
    font-size: 0.85rem;
    color: var(--faint);
    text-align: center;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 0.35rem 0;
    list-style: none;
  }
  details.more summary::-webkit-details-marker { display: none; }
  details.more summary::before { content: "\25BC  "; font-size: 0.7em; }
  details.more[open] summary::before { content: "\25B2  "; }
  article { margin-bottom: 0.9rem; overflow-wrap: break-word; }
  article.lead-story {
    column-span: all;
    border-top: 2px solid var(--ink);
    border-bottom: 1px solid var(--rule);
    padding: 1rem 0;
    margin-bottom: 1.2rem;
  }
  article.lead-story h3 {
    font-family: "Playfair Display", Georgia, serif;
    font-size: 1.8rem;
    font-weight: 900;
    line-height: 1.15;
    margin: 0 0 0.3rem;
  }
  article.brief {
    margin-bottom: 0.4rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px dotted var(--rule);
  }
  article.brief h3 {
    font-size: 0.85rem;
    font-weight: normal;
    margin: 0;
    display: inline;
  }
  article.brief .byline {
    display: inline;
    font-size: 0.75rem;
    margin: 0 0 0 0.3rem;
  }
  article.brief p { display: none; }
  .overheard {
    column-span: all;
    border: 2px solid var(--ink);
    padding: 0.8rem 1.2rem;
    margin: 1rem 0 1.4rem;
    background: #fffdf5;
  }
  .overheard h3 {
    font-variant: small-caps;
    letter-spacing: 0.2em;
    font-size: 0.9rem;
    text-align: center;
    margin: 0 0 0.6rem;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 0.4rem;
  }
  .overheard .quip {
    font-style: italic;
    font-size: 0.92rem;
    margin-bottom: 0.5rem;
    padding-left: 1rem;
    border-left: 2px solid var(--rule);
  }
  .overheard .quip .who {
    font-style: normal;
    font-variant: small-caps;
    font-size: 0.75rem;
    color: var(--faint);
  }
  article h3 {
    font-size: 1rem;
    margin: 0 0 0.15rem;
    overflow-wrap: break-word;
  }
  article h3 a { color: var(--ink); }
  .byline {
    font-variant: small-caps;
    font-size: 0.78rem;
    color: var(--faint);
    margin-bottom: 0.2rem;
  }
  article p {
    margin: 0;
    font-size: 0.92rem;
    text-align: justify;
  }
  .pullquote {
    column-span: all;
    text-align: center;
    font-style: italic;
    font-size: 1.2rem;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 0.9rem 1.5rem;
    margin: 0 0 1.4rem;
    overflow-wrap: break-word;
  }
  .pullquote p { margin: 0 0 0.35rem; }
  .pullquote p::before { content: "\201C"; }
  .pullquote p::after { content: "\201D"; }
  .weeklink {
    column-span: all;
    text-align: right;
    font-variant: small-caps;
    letter-spacing: 0.06em;
    margin: 0 0 1rem;
  }
  .pullquote .who {
    font-style: normal;
    font-variant: small-caps;
    font-size: 0.82rem;
    letter-spacing: 0.08em;
    color: var(--faint);
  }
  .quiet {
    font-style: italic;
    color: var(--faint);
    text-align: center;
    padding: 2rem 0;
  }
  footer {
    margin-top: 2rem;
    border-top: 4px double var(--ink);
    padding-top: 0.6rem;
    font-size: 0.8rem;
    color: var(--faint);
    text-align: center;
    font-variant: small-caps;
    letter-spacing: 0.1em;
  }
  a { color: #4a3f2a; }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <div class="kicker">{{KICKER}}</div>
    <h1>The Daily Commit</h1>
    <div class="repo">{{TITLE_LINK}}</div>
  </header>
  <div class="dateline">
    <span>{{DATELINE}}</span>
    <span>{{RECORD}}</span>
  </div>
  <div class="lede">{{LEDE}}</div>
  <div class="columns">
{{BODY}}
  </div>
  <footer>
    Set in pixels, printed nowhere &middot; generated by <a href="https://github.com/RogueAlg0/the-daily-commit">the-daily-commit</a>{{XKCD}}
  </footer>
</div>
</body>
</html>
